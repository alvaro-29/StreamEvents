{% extends "base.html" %}

{% block title %}Confirmar eliminació - StreamEvents{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> Confirmar Eliminació</h5>
                </div>
                <div class="card-body text-center">
                    <p class="mb-4">Estàs segur que vols eliminar l'esdeveniment <strong>{{ event.title }}</strong>?</p>
                    <p class="text-muted small mb-4">Aquesta acció no es pot desfer.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'events:event_detail' event.pk %}" class="btn btn-secondary">Cancel·lar</a>
                            <button type="submit" class="btn btn-danger">Eliminar definitivament</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
